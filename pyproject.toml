[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Unprefixed, unlike the games. The prefix on magmacrunch-george-boole and
# magmacrunch-thld exists to claim a family PyPI cannot scope; this is the
# family name itself, and it is the command you type.
name = "magmacrunch"
version = "0.7.1"
description = "The magmacrunch terminal arcade - a menu of every installed cabinet"
readme = "README.md"
# Both, because the distribution genuinely contains both: the launcher is
# Noncommercial and `magmacrunch/engine/` is Apache-2.0. `AND` is the SPDX way
# of saying "this holds material under each", which is the true statement -
# naming only PolyForm would ship the engine's licence text without declaring
# it, and naming only Apache would understate what governs the launcher.
license = "PolyForm-Noncommercial-1.0.0 AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [{ name = "magmacrunch media" }]
keywords = ["arcade", "terminal", "tui", "games", "launcher"]

# The engine with its terminal backend, plus the cabinets.
#
# The TUI engine (magmacrunch.engine) is self-contained — no dependency on
# texastoast or tkinter. Textual and Rich are the only external deps, and only
# needed by the terminal game runtime (core/tui_game.py).
#
# Depending on the games is a distribution convenience, not a code dependency:
# it is what makes `pip install magmacrunch` an arcade rather than an empty
# room. Nothing in this package imports them - they are found at runtime by
# enumerating the `magmacrunch.games` entry point group, so the launcher works
# with them uninstalled and finds a game published later without a release
# here. See AGENTS.md.
#
# The cabinet floors are the releases that read `Host.seated`, not the oldest
# that resolve. A cabinet predating it still runs — `seated` is the host's, and
# an old game simply never asks — but it cannot print the Esc hint, and the
# README promises that hint unconditionally. A pin that lets an install be
# quietly less than what is documented is the wrong pin.
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
    "magmacrunch-george-boole>=0.4.0",
    "magmacrunch-thld>=0.3.0",
    "magmacrunch-moonlight-drift>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
magmacrunch = "magmacrunch.__main__:main"

# Deliberately no [project.entry-points."magmacrunch.games"] - the launcher is
# not a cabinet, and declaring one would let it discover and seat itself.

[project.urls]
Homepage = "https://magmacrunch.com/arcade/"

[tool.hatch.build.targets.wheel]
packages = ["magmacrunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is not switched on by default. `pytest -q` is what you run while
# working and it should stay as fast as it is; `--cov` is what CI adds once.
[tool.coverage.run]
source = ["magmacrunch"]
# The launcher suite drives Textual's pilot, which runs the app on its own
# thread. Without this, everything the frame loop touches reads as unexecuted
# and the report is a list of false accusations.
concurrency = ["thread"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    # Protocol bodies. `...` under a method in a structural seam is the
    # declaration, not a branch anybody was supposed to run.
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# banner.py is mostly ASCII art, and the widest piece is 119 columns because
# that is how wide it is on magmacrunch.com. Rewrapping art is not a thing you
# can do, and the line limit has nothing to say about it.
"magmacrunch/banner.py" = ["E501"]
