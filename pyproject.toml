[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Unprefixed, unlike the games. The prefix on magmacrunch-george-boole and
# magmacrunch-thld exists to claim a family PyPI cannot scope; this is the
# family name itself, and it is the command you type.
name = "magmacrunch"
version = "0.1.0"
description = "The magmacrunch terminal arcade - a menu of every installed cabinet"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.10"
authors = [{ name = "magmacrunch media" }]
keywords = ["arcade", "terminal", "tui", "games", "launcher"]

# The engine with its terminal backend, plus the cabinets.
#
# Depending on the games is a distribution convenience, not a code dependency:
# it is what makes `pip install magmacrunch` an arcade rather than an empty
# room. Nothing in this package imports them - they are found at runtime by
# enumerating the `magmacrunch.games` entry point group, so the launcher works
# with them uninstalled and finds a game published later without a release
# here. See AGENTS.md.
dependencies = [
    "texastoast[tui]>=0.9.0",
    "magmacrunch-george-boole>=0.1.0",
    "magmacrunch-thld>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
magmacrunch = "magmacrunch.__main__:main"

# Deliberately no [project.entry-points."magmacrunch.games"] - the launcher is
# not a cabinet, and declaring one would let it discover and seat itself.

[project.urls]
Homepage = "https://magmacrunch.com/arcade/"

[tool.hatch.build.targets.wheel]
packages = ["magmacrunch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
