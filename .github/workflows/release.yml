# Publishes the launcher to PyPI as `magmacrunch`.
#
# One package built from the repo root, so the tag is a plain `v0.1.0` — the
# games prefix theirs with `tui-` because their repos hold three versions and
# a tag there has to say which one it releases. This repo holds one thing.
#
# Trusted Publishing: GitHub mints a short-lived identity token that PyPI
# verifies against a publisher configured for this repo. No API token, no
# repository secret, nothing to rotate. The publisher has to exist on PyPI
# before the first run — for a project that does not exist yet that means a
# "pending publisher" (pypi.org → Your account → Publishing), naming this
# repository and this workflow file.
#
# Release this one LAST. It depends on both cabinets, so a `pip install
# magmacrunch` before they are on PyPI is an unresolvable dependency.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with the packaged version publishes something
      # nobody can find again. Cheaper to fail here than to yank a release.
      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match pyproject version $PKG"
            exit 1
          fi

      # Deliberately installed WITHOUT its game dependencies. The suite runs
      # against fake cabinets, and an arcade with nothing installed is a case
      # it has to handle anyway — so this doubles as proof that the launcher
      # imports no game, which is the rule the whole design rests on.
      - name: Test, with no cabinets on the machine
        run: |
          pip install textual rich pytest ruff
          pip install --no-deps -e .
          python -m pytest -q
          ruff check .

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes
