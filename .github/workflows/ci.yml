# The launcher's suite, run against fake cabinets on GitHub-hosted runners.
#
# Deliberately installed WITHOUT the games it depends on. `ArcadeGame` is a
# structural protocol, so the tests satisfy it with fakes — and a suite that
# only passed when two unrelated packages happened to be installed would be a
# worse suite. Running with nothing installed also exercises the empty-floor
# case for free, and is what proves the launcher imports no game.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be run against a branch without opening a pull request first.
  workflow_dispatch:

jobs:
  tests:
    name: tests (no cabinets, ${{ matrix.os }}, py${{ matrix.python }})

    # `requires-python = ">=3.10"` and a README that offers macOS, Linux and
    # Windows are both promises, and a single ubuntu/3.12 job tested neither.
    # Nothing here is compiled — every package in the stack is a py3-none-any
    # wheel — so what this actually guards is the places pure Python still
    # differs: console-script installation, path handling, and the terminal's
    # encoding. That last one is not hypothetical on Windows, where stdout is
    # not UTF-8 by default and the banner is drawn out of block glyphs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The floor and the ceiling. Everything between them is interpolation;
        # the versions that break are the oldest one still supported and the
        # newest one released, and 3.14 is where an upstream that has not caught
        # up yet will show itself first.
        python: ["3.10", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # --no-deps because pyproject lists the cabinets, and installing them
      # would defeat the point of the job. It also means the engine's own
      # dependencies have to be named here: textual and rich are what
      # `magmacrunch.engine` needs, and with --no-deps nothing else supplies
      # them. They used to arrive as transitive dependencies of
      # `texastoast[tui]`, which is how this job stayed green through a
      # migration that removed texastoast from the project entirely — a stale
      # line was carrying the real requirement.
      - name: Install the launcher, without its cabinets
        run: |
          pip install "textual>=0.40" "rich>=13.0" pytest
          pip install --no-deps -e .

      - run: python -m pytest -q

      # Runs the installed console script rather than `python -m`, because the
      # entry point is the thing users type and the thing most likely to be
      # missing on a platform nobody tested.
      - name: An empty arcade still runs
        run: magmacrunch --list

  # Once, not six times: lint is a property of the source, not of the platform.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # Also once. Coverage is a property of the suite, and running it on six
  # platforms would produce six identical numbers at six times the cost.
  #
  # No threshold. The number is here to be looked at when it moves, and a gate
  # set at today's figure mostly teaches people to write tests that raise it
  # rather than tests that catch things. What it did already earn its keep on:
  # `input/recording.py` reported 0%, which is what turned "this module has no
  # test file" into "this module has no caller either".
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the launcher, without its cabinets
        run: |
          pip install "textual>=0.40" "rich>=13.0" pytest pytest-cov
          pip install --no-deps -e .
      - run: python -m pytest -q --cov
